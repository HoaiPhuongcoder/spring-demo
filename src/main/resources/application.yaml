spring:
  application:
    name: demo
  config:
    # Local secrets (DB_URL, DB_USERNAME, DB_PASSWORD) live in .env, which is git-ignored.
    # Real environment variables take precedence over it.
    import: optional:file:.env[.properties]
  messages:
    basename: i18n/messages
    encoding: UTF-8
    # Unknown languages fall back to messages.properties (English), not the server's locale
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 2000
        one-indexed-parameters: false
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
