# Default (English) messages. Add the same keys to messages_<lang>.properties for other languages.
# Messages that take arguments ({0}) are MessageFormat patterns: write a literal quote as ''.

# ErrorCode messages: error.<ERROR_CODE>
error.INTERNAL_ERROR=An unexpected error occurred, please try again later
error.VALIDATION_ERROR=Invalid request data
error.MALFORMED_REQUEST=Malformed request body
error.RESOURCE_NOT_FOUND=Resource not found
error.METHOD_NOT_ALLOWED=HTTP method not supported
error.INVALID_CURSOR=Invalid or expired cursor
error.UNAUTHORIZED=Not authenticated or session expired
error.FORBIDDEN=Access denied
error.USER_NOT_FOUND=User not found
error.EMAIL_EXISTED=Email already exists

# Detailed messages
error.param.missing=Missing required parameter ''{0}''
error.param.invalid=Invalid value for parameter ''{0}''
error.data-integrity=Data violates a constraint

# Binding errors (Spring message codes), e.g. a non-numeric value for an integer parameter
typeMismatch=has an invalid value
